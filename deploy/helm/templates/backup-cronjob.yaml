{{- if .Values.backup.enabled }}
# Requires an ops image containing pg-backup.sh (build Dockerfile.ops and set
# backup.image). Disabled by default: a CronJob pointing at an image nobody
# built is a backup control that silently does not exist.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verifica-pg-backup
spec:
  schedule: "17 2 * * *"      # daily 02:17 UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup
              image: {{ .Values.backup.image }}
              command: ["/usr/local/bin/pg-backup.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - secretRef: { name: verifica-server }       # DATABASE_URL
                - secretRef: { name: verifica-backup }       # BACKUP_DESTINATION, AWS_*, BACKUP_GPG_RECIPIENT
              env:
                - { name: BACKUP_RETENTION_DAYS, value: "30" }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { cpu: 1,    memory: 1Gi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
{{- end }}

