apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifica-dashboard
  labels: { app: verifica, component: dashboard }
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels: { app: verifica, component: dashboard }
  template:
    metadata:
      labels: { app: verifica, component: dashboard }
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports: [{ containerPort: 8080, name: http }]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: verifica-dashboard
spec:
  selector: { app: verifica, component: dashboard }
  ports: [{ name: http, port: 80, targetPort: 8080 }]

